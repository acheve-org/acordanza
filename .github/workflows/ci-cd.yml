name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "design-system/**"
      - "landing/**"
      - "infra/terraform/**"
      - ".github/workflows/ci-cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "design-system/**"
      - "landing/**"
      - "infra/terraform/**"
      - ".github/workflows/ci-cd.yml"
  workflow_dispatch: {}

env:
  DOTNET_VERSION: "10.0.x"
  TF_STATE_RESOURCE_GROUP: rg-acordanza-tfstate
  TF_STATE_STORAGE_ACCOUNT: stacordanzatfstate
  TF_STATE_CONTAINER: tfstate
  TF_STATE_KEY: acordanza.tfstate
  TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
  TF_VAR_jwt_key: ${{ secrets.JWT_KEY }}
  TF_VAR_resend_api_key: ${{ secrets.RESEND_API_KEY }}
  TF_VAR_grafana_otlp_endpoint: ${{ vars.GRAFANA_OTLP_ENDPOINT }}
  TF_VAR_grafana_otlp_headers: ${{ secrets.GRAFANA_OTLP_HEADERS }}
  TF_VAR_cors_allowed_origins: ${{ vars.CORS_ALLOWED_ORIGINS || '[]' }} # JSON array string, e.g. ["https://acordanza.example.com"]; empty is fine, see infra/terraform/variables.tf
  TF_VAR_claude_organization_name: ${{ vars.CLAUDE_ORGANIZATION_NAME }} # sent to Anthropic with every Claude deployment (modelProviderData) — not secret, but a real value is required, see infra/README.md
  ACR_IMAGE_NAME: acordanza-api
  ACR_IMAGE_NAME_WORKER: acordanza-worker
  ACR_IMAGE_NAME_WEB: acordanza-web

permissions:
  contents: read

jobs:
  build-test-backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Acordanza.slnx

      - name: Build
        run: dotnet build Acordanza.slnx --no-restore -c Release

      - name: Unit test
        run: dotnet test Acordanza.slnx --no-build -c Release --filter "Category!=Integration"

      # Runs against real Postgres + Azurite via Testcontainers (see
      # backend/Acordanza.Api.Tests/Infrastructure/ApiFixture.cs) — ubuntu-latest has
      # Docker, and openapi-contract-check already depends on it, so this adds no new
      # runner requirement. Kept as its own step (rather than folded into the one
      # above) so a failure here reads unambiguously in the log.
      - name: Integration test
        run: dotnet test Acordanza.slnx --no-build -c Release

  build-test-frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read Bun version from .prototools
        id: tool_versions
        working-directory: ${{ github.workspace }}
        run: |
          version=$(awk -F'"' '/^\[/{exit} /^bun[[:space:]]*=/{print $2; exit}' .prototools)
          if [ -z "$version" ]; then
            echo "Could not find a top-level bun version in .prototools" >&2
            exit 1
          fi
          echo "bun_version=$version" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.tool_versions.outputs.bun_version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Design system lint
        working-directory: design-system
        run: bun run lint

      - name: Design system test
        working-directory: design-system
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        # Sanity-check the build compiles (tsc + vite build). VITE_API_URL is
        # intentionally unset here — this artifact is discarded; the real
        # build with the real API URL baked in happens in the Docker build
        # in build-and-deploy-frontend below.
        run: bun run build

  openapi-contract-check:
    name: OpenAPI contract in sync
    runs-on: ubuntu-latest
    # Regenerating the OpenAPI document actually boots the backend (see the comment on
    # OpenApiGenerateDocumentsOnBuild in Acordanza.Api.csproj), so this needs the same
    # Postgres + Azurite pair docker-compose.yml gives local dev, started here from that
    # same file rather than reimplemented as GitHub Actions service containers.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Read Bun version from .prototools
        id: tool_versions
        run: |
          version=$(awk -F'"' '/^\[/{exit} /^bun[[:space:]]*=/{print $2; exit}' .prototools)
          if [ -z "$version" ]; then
            echo "Could not find a top-level bun version in .prototools" >&2
            exit 1
          fi
          echo "bun_version=$version" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.tool_versions.outputs.bun_version }}

      - name: Start Postgres + Azurite
        # -f docker-compose.yml only: the default `docker compose` invocation also merges in
        # docker-compose.override.yml, which adds a `backend` service requiring JWT_KEY in
        # .env — irrelevant here (this job runs the backend directly via `dotnet build`, not
        # in a container) but its interpolation still fails the whole command if unset.
        run: docker compose -f docker-compose.yml up -d --wait postgres azurite

      - name: Regenerate the OpenAPI document
        working-directory: backend/Acordanza.Api
        env:
          ASPNETCORE_ENVIRONMENT: Development
          # Only used to boot the app long enough to generate the schema — this key
          # never signs a token anyone verifies, so it doesn't need to be a secret.
          Jwt__Key: "openapi-contract-check-only-not-a-real-signing-key"
        run: dotnet build Acordanza.Api.csproj -c Release -p:OpenApiGenerateDocumentsOnBuild=true

      - name: Fail if the committed OpenAPI document is stale
        run: git diff --exit-code -- backend/Acordanza.Api/openapi

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Regenerate frontend API types
        working-directory: frontend
        run: bun run generate-api

      - name: Fail if the committed generated types are stale
        run: git diff --exit-code -- frontend/src/api/generated.ts

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Scans the Terraform config and both Dockerfiles for
      # misconfigurations, failing the pipeline on any finding.
      # Accepted risks and scanner false positives are suppressed with a
      # written justification, either inline (#trivy:ignore in .tf files)
      # or in .trivyignore — see "Security scanning" in infra/README.md.
      - name: Scan IaC & Dockerfiles for misconfigurations (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          exit-code: "1"
          skip-dirs: infra/terraform/.terraform

      - name: Scan repo for leaked secrets (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: secret
          scan-ref: .
          exit-code: "1"

      # Trivy's config scanner has no GitHub Actions checks, so the
      # workflows themselves are scanned by zizmor (template injection,
      # credential leakage, unpinned/impostor actions, ...). Fails on any
      # low-or-higher finding; informational findings are advisory only.
      # Pinned by version here since Dependabot doesn't cover pipx specs.
      - name: Scan GitHub Actions workflows (zizmor)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # enables the online audits (impostor commits, known-vulnerable actions)
        run: pipx run zizmor==1.27.0 --min-severity=low .github/workflows/

  terraform:
    name: Terraform plan/apply
    needs: [build-test-backend, build-test-frontend, openapi-contract-check, security-scan]
    # Runs triggered by Dependabot don't get repository secrets (by GitHub
    # design, so a compromised dependency bump can't exfiltrate them), and
    # TF_VAR_postgres_admin_password/TF_VAR_jwt_key come through empty —
    # which fails `terraform plan` on the required Postgres password. Real
    # validation still happens on the push-triggered run once merged to
    # main, where secrets are available.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    permissions:
      id-token: write # required for OIDC login to Azure
      contents: read
    outputs:
      acr_name: ${{ steps.tf_outputs.outputs.acr_name }}
      acr_login_server: ${{ steps.tf_outputs.outputs.acr_login_server }}
      container_app_name: ${{ steps.tf_outputs.outputs.container_app_name }}
      container_app_fqdn: ${{ steps.tf_outputs.outputs.container_app_fqdn }}
      container_app_frontend_name: ${{ steps.tf_outputs.outputs.container_app_frontend_name }}
      container_app_job_enrichment_name: ${{ steps.tf_outputs.outputs.container_app_job_enrichment_name }}
      resource_group_name: ${{ steps.tf_outputs.outputs.resource_group_name }}
      backend_custom_domain: ${{ steps.tf_outputs.outputs.backend_custom_domain }}
      static_web_app_name: ${{ steps.tf_outputs.outputs.static_web_app_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read Terraform version from .prototools
        id: tool_versions
        working-directory: ${{ github.workspace }}
        run: |
          version=$(awk -F'"' '/^\[/{exit} /^terraform[[:space:]]*=/{print $2; exit}' .prototools)
          if [ -z "$version" ]; then
            echo "Could not find a top-level terraform version in .prototools" >&2
            exit 1
          fi
          echo "terraform_version=$version" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false
          terraform_version: ${{ steps.tool_versions.outputs.terraform_version }}

      - name: Azure login (OIDC)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=${TF_STATE_RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TF_STATE_CONTAINER}" \
            -backend-config="key=${TF_STATE_KEY}"

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      # Only apply on main — PRs get a plan only, no infra changes.
      - name: Terraform apply
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Read Terraform outputs
        id: tf_outputs
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          echo "acr_name=$(terraform output -raw acr_name)" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=$(terraform output -raw acr_login_server)" >> "$GITHUB_OUTPUT"
          echo "container_app_name=$(terraform output -raw container_app_name)" >> "$GITHUB_OUTPUT"
          echo "container_app_fqdn=$(terraform output -raw container_app_fqdn)" >> "$GITHUB_OUTPUT"
          echo "container_app_frontend_name=$(terraform output -raw container_app_frontend_name)" >> "$GITHUB_OUTPUT"
          echo "container_app_job_enrichment_name=$(terraform output -raw container_app_job_enrichment_name)" >> "$GITHUB_OUTPUT"
          echo "resource_group_name=$(terraform output -raw resource_group_name)" >> "$GITHUB_OUTPUT"
          echo "backend_custom_domain=$(terraform output -raw backend_custom_domain)" >> "$GITHUB_OUTPUT"
          echo "static_web_app_name=$(terraform output -raw static_web_app_name)" >> "$GITHUB_OUTPUT"

  build-and-deploy-backend:
    name: Build backend image & deploy
    needs: terraform
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC login to Azure
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Azure login (OIDC)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name "${{ needs.terraform.outputs.acr_name }}"

      - name: Build and push API image
        env:
          IMAGE: ${{ needs.terraform.outputs.acr_login_server }}/${{ env.ACR_IMAGE_NAME }}:${{ github.sha }}
        run: |
          docker build -t "$IMAGE" -f backend/Acordanza.Api/Dockerfile backend
          docker push "$IMAGE"

      # A separate project/image from the API's (plan 22), sharing only Acordanza.Core —
      # built from the same backend/ context so both stages see that shared project.
      - name: Build and push worker image
        env:
          IMAGE: ${{ needs.terraform.outputs.acr_login_server }}/${{ env.ACR_IMAGE_NAME_WORKER }}:${{ github.sha }}
        run: |
          docker build -t "$IMAGE" -f backend/Acordanza.Worker/Dockerfile backend
          docker push "$IMAGE"

      - name: Deploy new image to Container App
        run: |
          az containerapp update \
            --name "${{ needs.terraform.outputs.container_app_name }}" \
            --resource-group "${{ needs.terraform.outputs.resource_group_name }}" \
            --image "${{ needs.terraform.outputs.acr_login_server }}/${{ env.ACR_IMAGE_NAME }}:${{ github.sha }}"

      # The enrichment worker (plan 18) is its own image now (plan 22) — still rolled
      # together with the API in this same job, since they share Acordanza.Core's EF
      # models/migrations and must never run different models of the schema.
      - name: Deploy new image to enrichment Container Apps Job
        run: |
          az containerapp job update \
            --name "${{ needs.terraform.outputs.container_app_job_enrichment_name }}" \
            --resource-group "${{ needs.terraform.outputs.resource_group_name }}" \
            --image "${{ needs.terraform.outputs.acr_login_server }}/${{ env.ACR_IMAGE_NAME_WORKER }}:${{ github.sha }}"

  build-and-deploy-frontend:
    name: Build frontend image & deploy
    needs: terraform
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC login to Azure
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Azure login (OIDC)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name "${{ needs.terraform.outputs.acr_name }}"

      - name: Build and push image
        env:
          IMAGE: ${{ needs.terraform.outputs.acr_login_server }}/${{ env.ACR_IMAGE_NAME_WEB }}:${{ github.sha }}
        run: |
          docker build \
            --build-arg VITE_API_URL="https://${{ needs.terraform.outputs.backend_custom_domain }}/api" \
            -t "$IMAGE" -f frontend/Dockerfile .
          docker push "$IMAGE"

      - name: Deploy new image to Container App
        run: |
          az containerapp update \
            --name "${{ needs.terraform.outputs.container_app_frontend_name }}" \
            --resource-group "${{ needs.terraform.outputs.resource_group_name }}" \
            --image "${{ needs.terraform.outputs.acr_login_server }}/${{ env.ACR_IMAGE_NAME_WEB }}:${{ github.sha }}"

  deploy-landing:
    name: Deploy landing page
    needs: terraform
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC login to Azure
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Azure login (OIDC)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Static Web Apps' deploy action only supports its own deployment
      # token (not OIDC), and that token is Azure-generated rather than
      # something we choose ourselves — so it's fetched fresh from Azure on
      # every run instead of being stored as a long-lived GitHub secret.
      - name: Get deployment token
        id: swa_token
        run: |
          token=$(az staticwebapp secrets list \
            --name "${{ needs.terraform.outputs.static_web_app_name }}" \
            --resource-group "${{ needs.terraform.outputs.resource_group_name }}" \
            --query "properties.apiKey" -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Deploy static files
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa_token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: landing
          output_location: ""
          skip_app_build: true
