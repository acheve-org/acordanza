services:
  postgres:
    image: postgres:18 # Should be the same version that the postgres_version variable in the infra/terraform folder
    container_name: acordanza-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acordanza}
      POSTGRES_USER: ${POSTGRES_USER:-acordanza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acordanza}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - acordanza-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acordanza} -d ${POSTGRES_DB:-acordanza}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  acordanza-postgres-data:
