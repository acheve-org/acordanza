services:
  postgres:
    image: postgres:18 # Should be the same version that the postgres_version variable in the infra/terraform folder
    container_name: acordanza-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acordanza}
      POSTGRES_USER: ${POSTGRES_USER:-acordanza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acordanza}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - acordanza-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acordanza} -d ${POSTGRES_DB:-acordanza}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local stand-in for the "topos" Azure Storage account (see infra/terraform/storage.tf).
  # The backend talks to it via Storage:ConnectionString in appsettings.Development.json,
  # using Azurite's well-known devstoreaccount1 credentials — never used in production,
  # where the container app authenticates via managed identity instead.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: acordanza-azurite
    restart: unless-stopped
    # --skipApiVersionCheck: the Azure.Storage.Blobs/Queues SDK version the backend
    # uses sends a newer x-ms-version header than this Azurite image knows
    # about; Azurite otherwise rejects every request outright. Queue service is for
    # the route-enrichment queue (plan 18) — Azurite emulates it the same way it
    # emulates blobs.
    command: "azurite --blobHost 0.0.0.0 --blobPort 10000 --queueHost 0.0.0.0 --queuePort 10001 --skipApiVersionCheck"
    ports:
      - "${AZURITE_BLOB_PORT:-10000}:10000"
      - "${AZURITE_QUEUE_PORT:-10001}:10001"
    volumes:
      - acordanza-azurite-data:/data

volumes:
  acordanza-postgres-data:
  acordanza-azurite-data:
