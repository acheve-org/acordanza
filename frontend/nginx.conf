server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers.
    #
    # Two nginx specifics worth knowing before editing these. They sit at server
    # level, and `add_header` only inherits into a `location` when that location
    # defines *no* add_header of its own — so adding a single one inside
    # `location /` below would silently drop every header here. And `always` is
    # what makes them ride on error responses too, not just 2xx/3xx.
    #
    # Why a CSP matters more than usual for this app: the session JWT lives in
    # localStorage (see AuthContext), so an XSS is a token theft. script-src is
    # the directive that prevents the injection and connect-src the one that
    # prevents the exfiltration; the rest is hygiene.
    #
    # - script-src 'self': the Vite build emits one external module and no
    #   inline script, so this costs nothing and blocks injected <script> and
    #   eval outright.
    # - connect-src: the API origin and nothing else, substituted at image build
    #   time from the same VITE_API_URL the bundle is compiled with (see
    #   Dockerfile) so the policy and the requests it governs cannot disagree.
    #   Amplitude needs no entry of its own: the browser SDK posts to the
    #   same-origin /_i/e proxy below, which 'self' already covers.
    # - style-src 'unsafe-inline' is not optional: React writes style=""
    #   attributes and Leaflet positions every pane and tile that way, so a
    #   nonce/hash policy would break the map. It buys an attacker style
    #   injection, not script execution.
    # - img-src covers the two places images actually come from: OpenTopoMap
    #   tiles (AreaMap) and topo/area photos on Blob Storage SAS URLs. The
    #   storage account is a wildcard because its name isn't a build arg here;
    #   images are a poor exfiltration channel, so the looser bound is fine.
    # - fonts.googleapis.com/gstatic.com are the webfonts index.html links.
    #
    # This file is only used by the built container image; `bun dev` serves
    # through Vite and never sees it.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.tile.opentopomap.org https://*.blob.core.windows.net; connect-src 'self' __API_ORIGIN__" always;

    # frame-ancestors above already says this to every browser that matters;
    # this is the same answer for the ones that only know the old header.
    add_header X-Frame-Options "DENY" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Geolocation is a real feature here (the map's "locate me", see
    # useGeolocation), so it stays allowed for this origin; the rest are things
    # this app has no business asking for.
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;

    # Deliberately no includeSubDomains/preload: the app, the API and the
    # landing page are three separate hostnames under one apex, and this header
    # should only speak for the one serving it. Container Apps terminates TLS in
    # front of this, so plain-HTTP requests never reach nginx at all.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Amplitude's ingestion endpoint, proxied through this origin so that ad-blockers
    # can't drop it: api2.amplitude.com is on every common filter list, and a blocked
    # request means the event is simply never recorded. Served from our own domain it
    # is first-party and unblockable. The path has to stay opaque — filter lists match
    # tell-tale substrings ("amplitude", "analytics", "track", "collect", "event")
    # even on a first-party domain — and must agree with PROXY_PATH in
    # src/lib/analytics.ts, which is the only thing that ever calls it.
    #
    # Exact-match location and POST-only, deliberately: a prefix match would turn this
    # server into a general-purpose proxy for anything under api2.amplitude.com.
    location = /_i/e {
        limit_except POST {
            deny all;
        }

        # The upstream goes through a variable on purpose. With a literal hostname
        # nginx resolves it once, at startup, and refuses to start if DNS is briefly
        # unavailable — taking the entire frontend down over an analytics dependency.
        # A variable defers resolution to request time (hence the resolver), so a DNS
        # failure costs one dropped event and nothing else. Public resolvers rather
        # than Azure's 168.63.129.16: Container Apps runs on managed AKS whose CoreDNS
        # address we don't control, and this hostname is public anyway.
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        set $amplitude_ingest https://api2.amplitude.com/2/httpapi;
        proxy_pass $amplitude_ingest;

        proxy_ssl_server_name on;
        proxy_set_header Host api2.amplitude.com;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Blanking these is what keeps the client's IP from reaching Amplitude, and it
        # takes an explicit empty value: Container Apps' ingress sets X-Forwarded-For
        # and X-Envoy-External-Address on the way in, and nginx forwards inbound
        # headers to the upstream untouched, so omitting these lines would hand
        # Amplitude every visitor's home address. The cost is the geo columns — every
        # event reads as the Azure region — which is worth nothing for a private app
        # whose users are all known. (nginx drops a header set to "".)
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Envoy-External-Address "";
        proxy_set_header X-Forwarded-Proto "";

        # An event payload is a few hundred bytes; this is a cap on abuse, not a limit
        # anything legitimate approaches.
        client_max_body_size 64k;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
