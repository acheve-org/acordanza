<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Acordanza</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Archivo:wght@700;800&display=swap"
  rel="stylesheet"
/>
<style>
  /* Color/typography/radius tokens mirrored from design-system/src/tokens.css (Acordanza's
     "Cool Minimal" system — see /DESIGN.md). This page is a standalone static site (no build
     step, no framework), so it can't import the design-system package directly — keep these
     values in sync with tokens.css by hand. Also, per DESIGN.md: no dark theme by design. */
  :root {
    --bg: #eef1f5;
    --text: #181b22;
    --text-dim: #5b6270;
    --accent: #3f3fe0;
    --accent-deep: #3634c4;
    --on-accent: #ffffff;
    --font-display: 'Archivo', sans-serif;
    --font-body: 'Inter', sans-serif;
    --radius-full: 9999px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    letter-spacing: 0.24px;
    padding: 2rem;
  }
  main {
    max-width: 32rem;
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 2.25rem;
    letter-spacing: -0.02em;
    margin: 0 0 0.5rem;
  }
  p {
    color: var(--text-dim);
    line-height: 1.6;
    font-size: 1.05rem;
  }
  .tagline {
    font-style: italic;
    color: var(--accent);
    font-size: 1rem;
    margin: 0 0 1.5rem;
    padding-left: 1rem;
    border-left: 2px solid var(--accent);
  }
  .tagline .pos {
    font-style: normal;
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    padding-right: 1rem;
  }
  a.cta {
    display: inline-flex;
    align-items: center;
    margin-top: 1.5rem;
    background: var(--accent);
    color: var(--on-accent);
    border-radius: var(--radius-full);
    padding: 0 26px;
    height: 46px;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.2px;
    text-decoration: none;
    transition: background 0.15s ease;
  }
  a.cta:hover { background: var(--accent-deep); }
</style>
</head>
<body>
<main>
  <h1>Acordanza</h1>
  <p class="tagline"><span class="pos">s. f.</span>relacionado con tener algo en la memoria o hacer memoria.</p>
  <p>
    Un catálogo privado para un grupo de amigos que escalan juntos.
  </p>
  <p>
    Solo cuentas reales, sin registro público.
  </p>
  <a class="cta" href="https://app.acordanza.eu">Abrir la app &rarr;</a>
</main>
</body>
</html>
